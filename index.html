<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八字量化分析终端 V2.5</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入核心依赖库 -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.1.12/umd/Recharts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>

  <style>
    ::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; cursor: pointer; }
    ::-webkit-calendar-picker-indicator:hover { opacity: 1; }
    /* 古典字体支持 */
    .font-serif-bazi { font-family: "Noto Serif SC", "SimSun", "STSong", serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    if (typeof React === 'undefined' || typeof window.Recharts === 'undefined') {
      document.getElementById('root').innerHTML = `
        <div style="color: #ef4444; padding: 20px; text-align: center; font-family: sans-serif; margin-top: 50px;">
          <h2>⚠️ 核心资源加载失败</h2>
          <p>由于您的网络环境或浏览器安全策略，React 引擎未能成功下载。</p>
          <p>请刷新页面重试，或尝试关闭广告拦截插件。</p>
        </div>
      `;
      throw new Error("React or Recharts is not defined.");
    }

    const { useState, useEffect, useMemo } = React;
    const { 
      Radar, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis,
      BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer,
      LineChart, Line, ReferenceLine, Cell
    } = window.Recharts;

    // --- 图标组件 ---
    const ActivityIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-cyan-400"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
    const ShieldAlertIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-rose-500 mb-2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
    const HeartIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2 text-pink-500"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>;
    const ArrowLeftIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>;
    const CalendarIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-cyan-500 mr-2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
    const InfoIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-cyan-400"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;
    const AlertCircleIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-rose-400"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
    const MapPinIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-purple-400"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>;
    const GridIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2 text-amber-500"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>;
    const TrophyIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2 text-yellow-500"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>;

    // --- 常量与基础数据字典 ---
    const ELEMENTS = ["木", "火", "土", "金", "水"];
    const STEMS = { 甲:"木", 乙:"木", 丙:"火", 丁:"火", 戊:"土", 己:"土", 庚:"金", 辛:"金", 壬:"水", 癸:"水" };
    const BRANCHES = {
      子: { 水: 1.0 }, 丑: { 土: 0.5, 水: 0.3, 金: 0.2 }, 寅: { 木: 0.5, 火: 0.3, 土: 0.2 },
      卯: { 木: 1.0 }, 辰: { 土: 0.5, 木: 0.3, 水: 0.2 }, 巳: { 火: 0.5, 金: 0.3, 土: 0.2 },
      午: { 火: 0.7, 土: 0.3 }, 未: { 土: 0.5, 火: 0.3, 木: 0.2 }, 申: { 金: 0.5, 水: 0.3, 土: 0.2 },
      酉: { 金: 1.0 }, 戌: { 土: 0.5, 金: 0.3, 火: 0.2 }, 亥: { 水: 0.7, 木: 0.3 }
    };
    const WEIGHTS = { year_stem: 0.05, year_branch: 0.05, month_stem: 0.15, month_branch: 0.40, day_stem: 0.00, day_branch: 0.20, hour_stem: 0.10, hour_branch: 0.05 };
    const GENERATES = { 木: "火", 火: "土", 土: "金", 金: "水", 水: "木" };
    const CONTROLS = { 木: "土", 土: "水", 水: "火", 火: "金", 金: "木" };

    const ZHI_RELATIONS = {
      合: [['子','丑'], ['寅','亥'], ['卯','戌'], ['辰','酉'], ['巳','申'], ['午','未']],
      半合: [['申','子'], ['子','辰'], ['寅','午'], ['午','戌'], ['巳','酉'], ['酉','丑'], ['亥','卯'], ['卯','未']],
      冲: [['子','午'], ['丑','未'], ['寅','申'], ['卯','酉'], ['辰','戌'], ['巳','亥']],
      害: [['子','未'], ['丑','午'], ['寅','巳'], ['卯','辰'], ['申','亥'], ['酉','戌']],
      破: [['子','酉'], ['寅','亥'], ['辰','丑'], ['午','卯'], ['申','巳'], ['戌','未']],
      刑: [['子','卯'], ['卯','子'], ['寅','巳'], ['巳','申'], ['申','寅'], ['丑','未'], ['未','戌'], ['戌','丑'], ['辰','辰'], ['午','午'], ['酉','酉'], ['亥','亥']]
    };

    // 阴阳字典
    const YANG_CHARS = ['甲', '丙', '戊', '庚', '壬', '子', '寅', '辰', '午', '申', '戌'];
    const YIN_CHARS = ['乙', '丁', '己', '辛', '癸', '丑', '卯', '巳', '未', '酉', '亥'];

    // 藏干本气五行及阴阳字典（用于十神精确计算）
    const CHAR_YIN_YANG = {
      甲:1, 乙:-1, 丙:1, 丁:-1, 戊:1, 己:-1, 庚:1, 辛:-1, 壬:1, 癸:-1,
      子:-1, 丑:-1, 寅:1, 卯:-1, 辰:1, 巳:1, 午:-1, 未:-1, 申:1, 酉:-1, 戌:1, 亥:1
    };
    const WU_XING = {
      甲:'木', 乙:'木', 丙:'火', 丁:'火', 戊:'土', 己:'土', 庚:'金', 辛:'金', 壬:'水', 癸:'水',
      子:'水', 丑:'土', 寅:'木', 卯:'木', 辰:'土', 巳:'火', 午:'火', 未:'土', 申:'金', 酉:'金', 戌:'土', 亥:'水'
    };

    function getRelation(dm, target) {
      if (dm === target) return "比劫";
      if (GENERATES[target] === dm) return "印";
      if (GENERATES[dm] === target) return "食伤";
      if (CONTROLS[dm] === target) return "财";
      if (CONTROLS[target] === dm) return "官杀";
    }

    function getController(el) {
      for (let key in CONTROLS) if (CONTROLS[key] === el) return key;
    }

    // 获取具体的十神名称
    function getSpecificTenGod(dmChar, targetChar) {
      let dmEl = WU_XING[dmChar];
      let tgEl = WU_XING[targetChar];
      let dmYY = CHAR_YIN_YANG[dmChar];
      let tgYY = CHAR_YIN_YANG[targetChar];
      let isSameYY = dmYY === tgYY;

      if (dmEl === tgEl) return isSameYY ? "比肩" : "劫财";
      if (GENERATES[tgEl] === dmEl) return isSameYY ? "偏印" : "正印";
      if (GENERATES[dmEl] === tgEl) return isSameYY ? "食神" : "伤官";
      if (CONTROLS[dmEl] === tgEl) return isSameYY ? "偏财" : "正财";
      if (CONTROLS[tgEl] === dmEl) return isSameYY ? "七杀" : "正官";
    }

    // 获取地支的“本气”
    function getDominantElement(branch) {
      let maxVal = 0;
      let dom = '';
      for (let el in BRANCHES[branch]) {
        if (BRANCHES[branch][el] > maxVal) {
          maxVal = BRANCHES[branch][el];
          dom = el;
        }
      }
      return dom;
    }

    function checkZhiRelation(z1, z2) {
      let rels = [];
      for (const [type, pairs] of Object.entries(ZHI_RELATIONS)) {
        for (const pair of pairs) {
          if ((pair[0] === z1 && pair[1] === z2) || (pair[0] === z2 && pair[1] === z1 && type !== '刑')) rels.push(type);
          else if (type === '刑' && pair[0] === z1 && pair[1] === z2) rels.push(type);
        }
      }
      return [...new Set(rels)];
    }

    // 五行颜色映射函数
    const getElementColorClass = (el) => {
      switch(el) {
        case '木': return 'text-green-500 drop-shadow-[0_0_8px_rgba(34,197,94,0.4)]';  // 绿
        case '火': return 'text-red-500 drop-shadow-[0_0_8px_rgba(239,68,68,0.4)]';    // 大红
        case '土': return 'text-[#8b4513] drop-shadow-[0_0_8px_rgba(139,69,19,0.4)]';  // 棕 (SaddleBrown)
        case '金': return 'text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.4)]';    // 白
        case '水': return 'text-blue-500 drop-shadow-[0_0_8px_rgba(59,130,246,0.4)]';  // 蓝
        default: return 'text-slate-200';
      }
    };

    // --- 组件一：输入页面 ---
    function InputView({ onGenerate }) {
      const [formData, setFormData] = useState({
        date: '1995-05-15',
        time: '14:30',
        gender: 'M'
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        onGenerate(formData);
      };

      return (
        <div className="min-h-screen flex items-center justify-center relative overflow-hidden bg-slate-950">
          <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-cyan-600/20 blur-[100px] rounded-full pointer-events-none"></div>
          
          <div className="w-full max-w-md bg-slate-900/80 backdrop-blur-md border border-slate-700/50 p-8 rounded-2xl shadow-2xl relative z-10">
            <div className="flex flex-col items-center mb-8">
              <ActivityIcon />
              <h1 className="text-2xl font-bold tracking-widest text-slate-100 mt-4">八字量化分析终端</h1>
              <p className="text-slate-500 text-xs mt-1 font-mono">Bazi Quantitative Model V2.5</p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-6">
              <div className="flex justify-center mb-6 border-b border-slate-700 pb-6">
                <div className="bg-slate-800 p-1 rounded-lg flex shadow-inner">
                  <button type="button" onClick={() => setFormData({...formData, gender: 'M'})} className={`px-6 py-2 text-sm font-bold rounded-md transition-all ${formData.gender === 'M' ? 'bg-cyan-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>男 命 (M)</button>
                  <button type="button" onClick={() => setFormData({...formData, gender: 'F'})} className={`px-6 py-2 text-sm font-bold rounded-md transition-all ${formData.gender === 'F' ? 'bg-pink-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>女 命 (F)</button>
                </div>
              </div>

              <div>
                <label className="text-xs text-slate-400 mb-2 block flex items-center"><CalendarIcon /> 出生日期 (公历)</label>
                <input 
                  type="date" 
                  value={formData.date}
                  onChange={e => setFormData({...formData, date: e.target.value})}
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-slate-100 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all font-mono"
                  required
                />
              </div>

              <div>
                <label className="text-xs text-slate-400 mb-2 block flex items-center"><CalendarIcon /> 出生时间</label>
                <input 
                  type="time" 
                  value={formData.time}
                  onChange={e => setFormData({...formData, time: e.target.value})}
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-slate-100 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all font-mono"
                  required
                />
              </div>

              <button type="submit" className="w-full mt-8 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-cyan-900/30 transition-all active:scale-95 flex justify-center items-center tracking-widest">
                排盘推演模型
              </button>
            </form>
          </div>
        </div>
      );
    }

    // --- 组件二：结果仪表盘 ---
    function ResultDashboard({ baziModel, onBack }) {
      const [activeDyIdx, setActiveDyIdx] = useState(baziModel.defaultDyIdx);
      const [activeLnIdx, setActiveLnIdx] = useState(baziModel.defaultLnIdx);

      const handleDyChange = (e) => {
        setActiveDyIdx(Number(e.target.value));
        setActiveLnIdx(0);
      };

      const quantData = useMemo(() => {
        const { pillars, daYuns, dmElement, gender } = baziModel;
        const activeDaYun = daYuns[activeDyIdx];
        const activeLiuNian = activeDaYun.liuNians[activeLnIdx];
        const dyYearOffset = activeLnIdx + 1;

        // 1. 命局基座
        let base = { 木: 0, 火: 0, 土: 0, 金: 0, 水: 0 };
        ['y', 'm', 'h'].forEach(pos => base[STEMS[pillars[`${pos}Stem`]]] += WEIGHTS[`${pos==='y'?'year':pos==='m'?'month':'hour'}_stem`]);
        ['y', 'm', 'd', 'h'].forEach(pos => {
          let branchData = BRANCHES[pillars[`${pos}Branch`]];
          let weight = WEIGHTS[`${pos==='y'?'year':pos==='m'?'month':pos==='d'?'day':'hour'}_branch`];
          for (let el in branchData) base[el] += branchData[el] * weight;
        });

        // 2. 日主强弱
        let rComponents = { 比劫: 0, 印: 0, 食伤: 0, 财: 0, 官杀: 0 };
        for (let el of ELEMENTS) rComponents[getRelation(dmElement, el)] += base[el];
        let R = (rComponents['比劫'] + rComponents['印']) - (rComponents['食伤'] + rComponents['财'] + rComponents['官杀']);
        let isStrong = R > 0;
        let dmType = '均衡';
        if (R >= 0.3) dmType = '身极强'; else if (R > 0.1) dmType = '身强';
        else if (R <= -0.3) dmType = '身极弱'; else if (R < -0.1) dmType = '身弱';

        // 3. K值
        let K = {};
        for (let el of ELEMENTS) {
          let deviation = Math.abs(base[el] - 0.2) / 0.8;
          let weight = deviation + 0.15;
          let rel = getRelation(dmElement, el);
          let sign = isStrong ? (['财', '官杀', '食伤'].includes(rel) ? 1 : -1) : (['印', '比劫'].includes(rel) ? 1 : -1);
          K[el] = Number((weight * sign).toFixed(4));
        }

        // --- 核心模块：6. 命局层次评估逻辑 (格局、用神、阴阳、坏点) ---
        let rankData = { level: '', color: '', desc: '' };
        
        // 阴阳平衡检测
        const baziChars = [pillars.yStem, pillars.yBranch, pillars.mStem, pillars.mBranch, pillars.dStem, pillars.dBranch, pillars.hStem, pillars.hBranch];
        const isPureYang = baziChars.every(c => YANG_CHARS.includes(c));
        const isPureYin = baziChars.every(c => YIN_CHARS.includes(c));
        const isSpecialGender = (gender === 'M' && isPureYin) || (gender === 'F' && isPureYang);

        // 贴身相克 (坏点探测: 财星坏印, 伤官见官, 枭神夺食)
        let badAlerts = [];
        const checkCombo = (c1, c2) => {
            if (!c1 || !c2) return;
            let tg1 = getSpecificTenGod(pillars.dStem, c1);
            let tg2 = getSpecificTenGod(pillars.dStem, c2);
            let combo = [tg1, tg2];
            
            // 财星坏印 (正偏财 见 正偏印)
            let hasCai = combo.includes('正财') || combo.includes('偏财');
            let hasYin = combo.includes('正印') || combo.includes('偏印');
            if (hasCai && hasYin) badAlerts.push('财星坏印');
            
            // 伤官见官 (必须是伤官见正官)
            if (combo.includes('伤官') && combo.includes('正官')) badAlerts.push('伤官见官');
            
            // 枭神夺食 (必须是偏印见食神)
            if (combo.includes('偏印') && combo.includes('食神')) badAlerts.push('枭神夺食');
        };
        // 同柱上下克战
        checkCombo(pillars.yStem, pillars.yBranch);
        checkCombo(pillars.mStem, pillars.mBranch);
        checkCombo(pillars.dStem, pillars.dBranch);
        checkCombo(pillars.hStem, pillars.hBranch);
        // 贴身干支相克 (天干相邻, 地支相邻)
        checkCombo(pillars.yStem, pillars.mStem); // 年月干
        checkCombo(pillars.yBranch, pillars.mBranch); // 年月支
        checkCombo(pillars.mBranch, pillars.dBranch); // 月日支
        checkCombo(pillars.dBranch, pillars.hBranch); // 日时支
        
        badAlerts = [...new Set(badAlerts)];
        let badPointsCount = badAlerts.length;

        // 【新增核心检测】表面八字五行统计 (不看藏干杂气，用于最高优先级判定特殊格局)
        const surfaceElements = [
          WU_XING[pillars.yStem], getDominantElement(pillars.yBranch),
          WU_XING[pillars.mStem], getDominantElement(pillars.mBranch),
          WU_XING[pillars.dStem], getDominantElement(pillars.dBranch),
          WU_XING[pillars.hStem], getDominantElement(pillars.hBranch)
        ];
        let surfaceCounts = {};
        surfaceElements.forEach(el => surfaceCounts[el] = (surfaceCounts[el] || 0) + 1);
        let sortedSurface = Object.entries(surfaceCounts).sort((a, b) => b[1] - a[1]);
        let surfaceTop2Sum = sortedSurface[0][1] + (sortedSurface.length > 1 ? sortedSurface[1][1] : 0);
        let isSurfaceHang = surfaceTop2Sum >= 7; // 8个字里有7个以上属于前两大五行

        // 五行力量排序
        let sortedBase = ELEMENTS.map(el => ({ el, val: base[el] })).sort((a, b) => b.val - a.val);
        let top2Sum = sortedBase[0].val + sortedBase[1].val;
        let thirdVal = sortedBase.length > 2 ? sortedBase[2].val : 0;
        
        // 获取全局出现的本气五行种类数量
        let chartElements = new Set([
          WU_XING[pillars.yStem], getDominantElement(pillars.yBranch),
          WU_XING[pillars.mStem], getDominantElement(pillars.mBranch),
          WU_XING[pillars.dStem], getDominantElement(pillars.dBranch),
          WU_XING[pillars.hStem], getDominantElement(pillars.hBranch)
        ]);

        // 甄别原局用神
        let yongShens = ELEMENTS.filter(el => K[el] > 0);
        let yongShenPower = yongShens.reduce((sum, el) => sum + base[el], 0);

        // 检测用神是否被冲
        const internalPillars = [pillars.yBranch, pillars.mBranch, pillars.dBranch, pillars.hBranch];
        let clashedYongShen = false;
        for(let i=0; i<internalPillars.length; i++){
          for(let j=i+1; j<internalPillars.length; j++){
             if (checkZhiRelation(internalPillars[i], internalPillars[j]).includes('冲')) {
                let hasYsInI = yongShens.some(el => BRANCHES[internalPillars[i]][el] !== undefined);
                let hasYsInJ = yongShens.some(el => BRANCHES[internalPillars[j]][el] !== undefined);
                if (hasYsInI || hasYsInJ) clashedYongShen = true;
             }
          }
        }

        // 瀑布流判断定级
        let rawRank = 0; // 5:夯, 4:顶级, 3:人上人, 2:NPC, 1:拉完了
        
        // 【修正规则】优先判定夯：原局表面字有7个及以上是最多两种五行，或者权重计算极度偏枯
        if (isSurfaceHang || (top2Sum >= 0.80 && thirdVal < 0.20 && chartElements.size <= 3)) {
            rawRank = 5;
        } else if (yongShenPower <= 0.05 || (yongShenPower <= 0.15 && clashedYongShen)) {
            rawRank = 1;
        } else if (yongShenPower > 0.35 && !clashedYongShen) {
            rawRank = 4;
        } else if ((yongShenPower > 0.35 && clashedYongShen) || (yongShenPower > 0.20 && yongShenPower <= 0.35)) {
            rawRank = 3;
        } else {
            rawRank = 2;
        }

        // 【新增规则】坏点降级惩罚 (严格排除 夯 格局，免除其常规降级)
        if (rawRank >= 3 && rawRank < 5 && badPointsCount > 0) {
            rawRank = 2; // 遭遇核心十神贴身相克，从高层直降为 NPC
        } else if (rawRank === 2 && badPointsCount > 1) {
            rawRank = 1; // 本就平庸还多个坏点打架，降为最低
        }

        // 写入最终评级描述
        if (rawRank === 5) {
          let mainElsStr = sortedSurface[0][0];
          if (sortedSurface.length > 1 && sortedSurface[1][1] > 0) {
              mainElsStr += `】与【${sortedSurface[1][0]}`;
          }
          rankData.level = "夯 (特殊格局)";
          rankData.color = "text-amber-400 drop-shadow-[0_0_10px_rgba(251,191,36,0.6)]";
          rankData.desc = `原局五行极度纯粹，天干与地支本气主要由【${mainElsStr}】主导（占据全局 ${surfaceTop2Sum}/8 的绝对数量）。构成“两气成象”或“专旺/从格”等极度特殊的命局。气势磅礴，不受常规生克与藏干杂气约束，已优先免除系统降级惩罚，直接定级为夯。`;
        } else if (rawRank === 4) {
          rankData.level = "顶级 (格局大好)";
          rankData.color = "text-red-500 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]";
          rankData.desc = `用神（${yongShens.join('、')}）在原局中极具力量（占比 ${(yongShenPower*100).toFixed(1)}%），且不受刑冲破害及贴身克破损伤。用神有情有力，犹如顺水推舟，格局极高。`;
        } else if (rawRank === 3) {
          rankData.level = "人上人 (中高层次)";
          rankData.color = "text-orange-400 drop-shadow-[0_0_10px_rgba(251,146,60,0.6)]";
          rankData.desc = `用神（${yongShens.join('、')}）颇具力量（占比 ${(yongShenPower*100).toFixed(1)}%）${clashedYongShen ? '，虽略带地支冲克' : '，属中上水准'}。总体格局优良，只要大运岁运配合得当，极易脱颖而出。`;
        } else if (rawRank === 2) {
          rankData.level = "NPC (普罗大众)";
          rankData.color = "text-slate-300 drop-shadow-[0_0_5px_rgba(203,213,225,0.8)]";
          rankData.desc = `用神（${yongShens.join('、')}）偏弱或平平。${badPointsCount > 0 ? `且原局存在【贴身相克】（${badAlerts.join('、')}），导致用神或格局受损降级。` : ''}格局常态，属于大多数人的剧本，需安分守己，步步为营以待时机。`;
        } else {
          rankData.level = "拉完了 (气浊神枯)";
          rankData.color = "text-slate-500 drop-shadow-[0_0_5px_rgba(100,116,139,0.8)]";
          rankData.desc = `用神微弱或完全不见，且忌神猖狂。${badPointsCount > 0 ? `叠加【贴身相克】（${badAlerts.join('、')}），内部力量严重相互打架消耗。` : ''}属“气浊神枯”之象。人生路途多艰，需付出极大后天努力方能有所成。`;
        }

        // 阴阳异象标记
        if (isSpecialGender) {
           rankData.desc = `⚠️【异象预警】：您属于“${gender === 'M' ? '男命纯阴' : '女命纯阳'}”，违背自然阴阳交泰之道。此类命盘气场特殊，极易出现大起大落的反常规人生，层次不能单凭常理给级，必须结合大运重新定夺！\n\n` + rankData.desc;
           rankData.level += " (另评)";
           rankData.color = "text-purple-400 drop-shadow-[0_0_10px_rgba(192,132,252,0.8)]";
        }

        // 4. 环境计算函数
        const calcEnv = (dyStem, dyBranch, offsetYear, lnStem, lnBranch) => {
          let D = { 木: 0, 火: 0, 土: 0, 金: 0, 水: 0 }, Y = { 木: 0, 火: 0, 土: 0, 金: 0, 水: 0 };
          D[STEMS[dyStem]] += (10 - offsetYear) * 1.0;
          for (let el in BRANCHES[dyBranch]) D[el] += offsetYear * BRANCHES[dyBranch][el];
          Y[STEMS[lnStem]] += 4.0;
          for (let el in BRANCHES[lnBranch]) Y[el] += 6.0 * BRANCHES[lnBranch][el];

          let score = 0, dCont = 0, yCont = 0;
          for (let el of ELEMENTS) {
            dCont += 0.6 * K[el] * D[el];
            yCont += 0.4 * K[el] * Y[el];
          }
          return { D, Y, score: dCont + yCont, dScore: dCont, yScore: yCont };
        };

        let currentEnv = calcEnv(activeDaYun.stem, activeDaYun.branch, dyYearOffset, activeLiuNian.stem, activeLiuNian.branch);

        let projectionData = activeDaYun.liuNians.map((ln, idx) => {
          let env = calcEnv(activeDaYun.stem, activeDaYun.branch, idx + 1, ln.stem, ln.branch);
          return { year: `${ln.year}\n${ln.stem}${ln.branch}`, score: Number(env.score.toFixed(2)), dScore: Number(env.dScore.toFixed(2)), yScore: Number(env.yScore.toFixed(2)) };
        });

        // 5. 感情婚姻时空量化分析
        let spouseStar = gender === 'M' ? CONTROLS[dmElement] : getController(dmElement);
        let spouseStarName = gender === 'M' ? '财星(妻星)' : '官星(夫星)';
        const checkHasStar = (stem, branch) => (STEMS[stem] === spouseStar || (BRANCHES[branch] && BRANCHES[branch][spouseStar] !== undefined));
        
        let reportSections = [];

        let starPositions = [];
        if (checkHasStar(pillars.yStem, pillars.yBranch)) starPositions.push('年柱(根基)');
        if (checkHasStar(pillars.mStem, pillars.mBranch)) starPositions.push('月柱(父母兄弟宫)');
        if (checkHasStar(pillars.dStem, pillars.dBranch)) starPositions.push('日柱(夫妻宫)');
        if (checkHasStar(pillars.hStem, pillars.hBranch)) starPositions.push('时柱(子女宫)');

        let marriageTiming = "原局配偶星缺失或微弱，感情缘分稍有内敛，或恋爱过程易生波折。";
        if (starPositions.some(p => p.includes('年柱'))) marriageTiming = "原局配偶星现于年柱，多有早婚、早恋，或对象为旧识之象。";
        else if (starPositions.some(p => p.includes('月柱'))) marriageTiming = "配偶星现于月柱，多在正常适婚年龄遇到正缘成婚。";
        else if (starPositions.some(p => p.includes('时柱'))) marriageTiming = "配偶星主要偏于时柱，暗示缘分偏晚，晚婚则家庭更为平顺稳固。";
        
        reportSections.push({
          title: '原局星位与婚期推演',
          icon: <InfoIcon />,
          text: `命主为${gender === 'M' ? '男' : '女'}，日主为${dmElement}，代表配偶的【${spouseStarName}】五行为【${spouseStar}】。${starPositions.length > 0 ? `该星落于${starPositions.join('、')}。` : ''}${marriageTiming}`
        });

        let spousePalace = pillars.dBranch;
        let mRels = checkZhiRelation(spousePalace, pillars.mBranch);
        let hRels = checkZhiRelation(spousePalace, pillars.hBranch);
        let yRels = checkZhiRelation(spousePalace, pillars.yBranch);

        let originalPalaceTexts = [];
        let hasChong = mRels.includes('冲') || hRels.includes('冲');

        if (hasChong) {
          originalPalaceTexts.push("【原局逢冲】婚姻宫最忌临近的月柱或时柱相冲。您原局日支逢冲，命理云『日支逢冲无救应，十婚九变难白头』，暗示婚恋多坎坷，家庭易生波折，需以极大包容心经营并做适当化解。");
        }

        if (mRels.includes('合') || mRels.includes('半合')) {
          let text = "【宫合月支】月支代表家外环境与父母。夫妻宫合月支，表明婚后小家与大家互动极多。";
          let mTenGod = getRelation(dmElement, getDominantElement(pillars.mBranch));
          if (mTenGod === '印') text += "月支印星当令，尤指与长辈沟通顺畅。";
          if (BRANCHES[pillars.mBranch][spouseStar] !== undefined) text += `且月支暗藏${spouseStarName}，有『夫妻同心』之象，代表您或配偶协调能力极强，能完美处理婆媳、翁婿等大家与小家的关系。`;
          originalPalaceTexts.push(text);
        }

        if (hRels.includes('合') || hRels.includes('半合')) {
          let text = "【宫合时支】时支代表家内环境与晚年子女。夫妻宫合时支，表明婚后与子女互动多，晚年多伴随子女身边。";
          let hTenGod = getRelation(dmElement, getDominantElement(pillars.hBranch));
          if ((gender === 'M' && hTenGod === '官杀') || (gender === 'F' && hTenGod === '食伤')) {
            text += "时支恰逢子女星（正星得正位），更能代表与子女晚辈交流极佳，家庭内部氛围融洽。";
          }
          originalPalaceTexts.push(text);
        }

        let otherAlerts = [];
        ['刑', '害', '破'].forEach(rel => {
          if (mRels.includes(rel)) otherAlerts.push(`月支相${rel}`);
          if (hRels.includes(rel)) otherAlerts.push(`时支相${rel}`);
        });
        if (otherAlerts.length > 0 && !hasChong) {
          originalPalaceTexts.push(`【隐性摩擦】原局夫妻宫与邻支存在：${otherAlerts.join('、')}，表明感情或家庭生活中偶有暗流与隐形摩擦，需注重日常沟通。`);
        }

        if (originalPalaceTexts.length === 0) {
          originalPalaceTexts.push("【平稳安宁】原局夫妻宫未见明显刑冲合害，且未被左右夹击，自身感情基石相对稳固，喜静不喜动。");
        }

        reportSections.push({
          title: '原局夫妻宫（内环境）拓扑网络',
          icon: hasChong ? <AlertCircleIcon /> : <MapPinIcon />,
          text: originalPalaceTexts.join(' ')
        });

        let dyRels = checkZhiRelation(spousePalace, activeDaYun.branch);
        let lnRels = checkZhiRelation(spousePalace, activeLiuNian.branch);
        
        let starEnvAlerts = [];
        if (checkHasStar(activeDaYun.stem, activeDaYun.branch)) starEnvAlerts.push(`大运带有${spouseStarName}`);
        if (checkHasStar(activeLiuNian.stem, activeLiuNian.branch)) starEnvAlerts.push(`流年引动${spouseStarName}`);

        let envActionDetails = [];
        if (dyRels.includes('冲') || dyRels.includes('合')) envActionDetails.push(`大运相${dyRels.includes('冲')?'冲':'合'}`);
        if (lnRels.includes('冲') || lnRels.includes('合')) envActionDetails.push(`流年相${lnRels.includes('冲')?'冲':'合'}`);

        if (starEnvAlerts.length > 0 || envActionDetails.length > 0) {
          let envText = "";
          if (starEnvAlerts.length > 0) envText += `星动：${starEnvAlerts.join('，')}；`;
          if (envActionDetails.length > 0) envText += `宫动：${envActionDetails.join('，')}。`;
          
          envText += "星宫受引，是极其重要的婚恋信号！对于已婚人士，易现婚姻变数、感情摇摆或健康波动；对于未婚人士，则常代表着强烈的脱单、同居或结婚之象。";
          
          reportSections.push({
            type: 'alert',
            title: '当前岁运时空交会警示',
            icon: <AlertCircleIcon />,
            text: envText
          });
        } else {
          reportSections.push({
            type: 'safe',
            title: '当前岁运环境风平浪静',
            icon: <InfoIcon />,
            text: `选定的年月内，配偶星蛰伏，且外部大运流年未对夫妻宫造成猛烈的刑冲合害，总体处于相对平静的维持期。`
          });
        }

        return {
          base, dmElement, R: Number(R.toFixed(4)), dmType, K, currentEnv, projectionData,
          reportSections, activeDaYun, activeLiuNian, rankData
        };
      }, [baziModel, activeDyIdx, activeLnIdx]);

      const maxBaseVal = Math.max(...ELEMENTS.map(el => quantData.base[el]));
      const radarDomainMax = Math.max(0.5, Math.ceil(maxBaseVal * 10) / 10);
      const radarData = ELEMENTS.map(el => ({ subject: el, A: Number(quantData.base[el].toFixed(3)), fullMark: radarDomainMax }));

      const s = quantData.currentEnv.score;
      let label = '平 (HOLD)', color = 'text-slate-300';
      if (s >= 2.5) { label = '大吉 (STRONG BUY)'; color = 'text-emerald-400'; }
      else if (s >= 0.5) { label = '小吉 (ACCUMULATE)'; color = 'text-emerald-300'; }
      else if (s <= -2.5) { label = '大凶 (STRONG SELL)'; color = 'text-rose-500'; }
      else if (s <= -0.5) { label = '小凶 (REDUCE)'; color = 'text-rose-400'; }

      return (
        <div className="p-4 md:p-8">
          <header className="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-4 mb-6 gap-4">
            <div className="flex items-center space-x-4">
              <button onClick={onBack} className="p-2 hover:bg-slate-800 rounded-full transition-colors text-slate-400 hover:text-white" title="返回重新排盘">
                <ArrowLeftIcon />
              </button>
              <div>
                <h1 className="text-xl font-bold tracking-wider text-slate-100 flex items-center">八字量化分析终端 <span className="text-xs bg-cyan-900 text-cyan-300 px-2 py-0.5 rounded ml-3 font-mono">V 2.5</span></h1>
                <div className="text-xs text-slate-500 mt-1">
                  性别：{baziModel.gender === 'M' ? '乾造 (男)' : '坤造 (女)'}
                </div>
              </div>
            </div>
            
            <div className="flex bg-slate-900 border border-slate-700 rounded-lg p-1 shadow-lg">
               <select value={activeDyIdx} onChange={handleDyChange} className="bg-slate-800 text-cyan-400 text-sm font-bold p-2 outline-none border-r border-slate-700 cursor-pointer hover:bg-slate-700 transition-colors">
                 {baziModel.daYuns.map((dy, idx) => (
                   <option key={idx} value={idx}>{dy.startYear}-{dy.endYear} {dy.stem}{dy.branch}大运</option>
                 ))}
               </select>
               <select value={activeLnIdx} onChange={e => setActiveLnIdx(Number(e.target.value))} className="bg-slate-800 text-slate-200 text-sm p-2 outline-none cursor-pointer hover:bg-slate-700 transition-colors">
                 {baziModel.daYuns[activeDyIdx].liuNians.map((ln, idx) => (
                   <option key={idx} value={idx}>{ln.year} {ln.stem}{ln.branch}年</option>
                 ))}
               </select>
            </div>
          </header>

          <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 mb-6">
            <div className="xl:col-span-7 bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl relative overflow-hidden flex flex-col">
              <div className="absolute top-0 left-0 w-1.5 h-full bg-amber-600"></div>
              <div className="flex items-center justify-between mb-4 pl-4">
                <h2 className="text-base font-bold text-slate-300 flex items-center tracking-widest">
                  <GridIcon /> 四柱原局 (命盘)
                </h2>
                <div className="text-xs text-slate-500 font-mono">
                  从左至右：年、月、日、时
                </div>
              </div>

              <div className="flex justify-around items-center w-full px-2 mt-auto mb-auto">
                {/* 年柱 */}
                <div className="flex flex-col items-center p-3 sm:p-4 bg-slate-800/30 rounded-xl border border-slate-700/50 w-20 sm:w-24 shadow-inner">
                  <span className="text-xs text-slate-500 mb-3 tracking-widest">年柱</span>
                  <span className={`text-3xl sm:text-4xl font-serif-bazi font-bold mb-3 ${getElementColorClass(STEMS[baziModel.pillars.yStem])}`}>
                    {baziModel.pillars.yStem}
                  </span>
                  <span className={`text-3xl sm:text-4xl font-serif-bazi font-bold ${getElementColorClass(getDominantElement(baziModel.pillars.yBranch))}`}>
                    {baziModel.pillars.yBranch}
                  </span>
                </div>
                {/* 月柱 */}
                <div className="flex flex-col items-center p-3 sm:p-4 bg-slate-800/30 rounded-xl border border-slate-700/50 w-20 sm:w-24 shadow-inner">
                  <span className="text-xs text-slate-500 mb-3 tracking-widest">月柱</span>
                  <span className={`text-3xl sm:text-4xl font-serif-bazi font-bold mb-3 ${getElementColorClass(STEMS[baziModel.pillars.mStem])}`}>
                    {baziModel.pillars.mStem}
                  </span>
                  <span className={`text-3xl sm:text-4xl font-serif-bazi font-bold ${getElementColorClass(getDominantElement(baziModel.pillars.mBranch))}`}>
                    {baziModel.pillars.mBranch}
                  </span>
                </div>
                {/* 日柱 */}
                <div className="flex flex-col items-center p-3 sm:p-4 bg-slate-800/60 rounded-xl border-2 border-cyan-700/50 w-24 sm:w-28 shadow-[0_0_20px_rgba(8,145,178,0.15)] transform scale-105">
                  <span className="text-[10px] sm:text-xs text-cyan-400 mb-3 tracking-widest">日主({STEMS[baziModel.pillars.dStem]})</span>
                  <span className={`text-3xl sm:text-4xl font-serif-bazi font-bold mb-3 ${getElementColorClass(STEMS[baziModel.pillars.dStem])}`}>
                    {baziModel.pillars.dStem}
                  </span>
                  <span className={`text-3xl sm:text-4xl font-serif-bazi font-bold ${getElementColorClass(getDominantElement(baziModel.pillars.dBranch))}`}>
                    {baziModel.pillars.dBranch}
                  </span>
                </div>
                {/* 时柱 */}
                <div className="flex flex-col items-center p-3 sm:p-4 bg-slate-800/30 rounded-xl border border-slate-700/50 w-20 sm:w-24 shadow-inner">
                  <span className="text-xs text-slate-500 mb-3 tracking-widest">时柱</span>
                  <span className={`text-3xl sm:text-4xl font-serif-bazi font-bold mb-3 ${getElementColorClass(STEMS[baziModel.pillars.hStem])}`}>
                    {baziModel.pillars.hStem}
                  </span>
                  <span className={`text-3xl sm:text-4xl font-serif-bazi font-bold ${getElementColorClass(getDominantElement(baziModel.pillars.hBranch))}`}>
                    {baziModel.pillars.hBranch}
                  </span>
                </div>
              </div>
            </div>

            {/* 命局层次评估卡片 */}
            <div className="xl:col-span-5 bg-slate-900 border border-yellow-900/40 rounded-xl p-6 shadow-xl relative overflow-hidden flex flex-col justify-center">
              <div className="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-yellow-500 to-orange-500"></div>
              <h2 className="text-base font-bold text-yellow-500 mb-4 flex items-center tracking-widest">
                <TrophyIcon /> 命局层次评估 (格局/用神)
              </h2>
              <div className="flex flex-col items-center justify-center bg-slate-950/50 p-5 rounded-lg border border-slate-800/50 mb-3 shadow-inner">
                <div className="text-xs text-slate-500 mb-2">系统综合判定量级</div>
                <div className={`text-3xl sm:text-4xl font-black font-mono tracking-widest ${quantData.rankData.color}`}>
                  {quantData.rankData.level}
                </div>
              </div>
              <div className="text-slate-300 text-[13px] leading-relaxed tracking-wide opacity-90 px-1 whitespace-pre-wrap">
                {quantData.rankData.desc}
              </div>
            </div>

          </div>

          <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 mb-6">
            <div className="xl:col-span-3 bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl flex flex-col justify-center items-center relative overflow-hidden">
              <div className="text-slate-400 text-sm mb-1">年度运势 S_t <span className="text-xs text-slate-500 ml-1">({quantData.activeLiuNian.year}年)</span></div>
              <div className={`text-6xl font-mono font-black my-3 ${s > 0 ? 'text-emerald-400 drop-shadow-[0_0_15px_rgba(16,185,129,0.5)]' : 'text-red-400 drop-shadow-[0_0_15px_rgba(239,68,68,0.5)]'}`}>
                {s > 0 ? '+' : ''}{s.toFixed(2)}
              </div>
              <div className={`text-sm font-bold tracking-wider ${color}`}>{label}</div>
              
              <div className="mt-5 w-full grid grid-cols-2 gap-4 text-center border-t border-slate-800 pt-5">
                <div><div className="text-xs text-slate-500 mb-1">日主形态</div><div className="text-lg text-slate-200 font-bold">{quantData.dmElement} • {quantData.dmType}</div></div>
                <div><div className="text-xs text-slate-500 mb-1">系统R因子</div><div className="text-lg text-slate-200 font-mono">{quantData.R > 0 ? '+'+quantData.R : quantData.R}</div></div>
              </div>

              {Math.abs(quantData.R) >= 0.3 && (
                <div className="absolute top-0 left-0 w-full h-full bg-slate-900/90 backdrop-blur-md border-2 border-rose-500/50 flex flex-col items-center justify-center p-4 z-10 text-center animate-pulse">
                  <ShieldAlertIcon />
                  <div className="text-rose-400 font-bold text-sm">特殊命格警示 (极值失衡)</div>
                  <div className="text-xs text-slate-300 mt-2">系统捕捉到 R 因子达 ({quantData.R})。已切入【偏枯架构】策略线。</div>
                  <button onClick={(e) => e.currentTarget.parentElement.style.display='none'} className="mt-4 text-xs bg-slate-800 hover:bg-slate-700 px-4 py-1.5 rounded text-slate-300 border border-slate-600 transition-colors">知悉并关闭</button>
                </div>
              )}
            </div>

            <div className="xl:col-span-9 bg-slate-900 border border-pink-900/40 rounded-xl p-6 shadow-xl relative overflow-hidden flex flex-col justify-center">
              <div className="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-pink-500 to-purple-500"></div>
              <h2 className="text-base font-bold text-pink-400 mb-4 flex items-center">
                <HeartIcon /> 感情时空动态解析 (星宫双测引擎)
              </h2>
              <div className="flex flex-col space-y-4">
                {quantData.reportSections.map((section, idx) => (
                  <div key={idx} className={`text-sm leading-relaxed tracking-wide p-4 rounded-lg border ${section.type === 'alert' ? 'bg-rose-950/20 border-rose-900/50 text-rose-200 shadow-[inset_0_0_15px_rgba(225,29,72,0.1)]' : 'bg-slate-950/50 border-slate-800/50 text-slate-300'}`}>
                    <div className="font-bold mb-1.5 flex items-center tracking-widest text-[13px] opacity-90">
                      {section.icon} <span className="ml-1.5">{section.title}</span>
                    </div>
                    <div className="pl-6 opacity-90">{section.text}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 xl:grid-cols-12 gap-6">
            <div className="xl:col-span-8 bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl h-[450px]">
              <h2 className="text-sm font-bold text-slate-400 mb-2">【{quantData.activeDaYun.stem}{quantData.activeDaYun.branch}大运】 10年运势波动曲线</h2>
              <ResponsiveContainer width="100%" height="100%">
                <LineChart data={quantData.projectionData} margin={{ top: 10, right: 30, left: 0, bottom: 20 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                  <XAxis dataKey="year" stroke="#64748b" tick={{fill: '#64748b', fontSize: 11}} />
                  <YAxis stroke="#64748b" tick={{fill: '#64748b', fontSize: 12}} />
                  <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', color: '#fff' }} itemStyle={{ color: '#e2e8f0' }} />
                  <ReferenceLine y={0} stroke="#475569" strokeWidth={2} />
                  
                  <ReferenceLine x={`${quantData.activeLiuNian.year}\n${quantData.activeLiuNian.stem}${quantData.activeLiuNian.branch}`} stroke="#06b6d4" strokeDasharray="3 3" label={{ position: 'top', value: 'Target', fill: '#06b6d4', fontSize: 12, fontWeight: 'bold' }} />
                  
                  <Line type="monotone" dataKey="score" name="总运势分" stroke="#10b981" strokeWidth={3} dot={{ r: 4, fill: '#10b981', stroke: '#0f172a', strokeWidth: 2 }} activeDot={{ r: 6 }} />
                  <Line type="monotone" dataKey="dScore" name="大运环境引力" stroke="#8b5cf6" strokeWidth={1} strokeDasharray="5 5" dot={false} />
                  <Line type="monotone" dataKey="yScore" name="流年环境引力" stroke="#3b82f6" strokeWidth={1} strokeDasharray="5 5" dot={false} />
                  <Legend wrapperStyle={{ fontSize: '12px', bottom: -5 }} />
                </LineChart>
              </ResponsiveContainer>
            </div>

            <div className="xl:col-span-4 space-y-6 flex flex-col">
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl flex-1 min-h-[450px]">
                <h2 className="text-sm font-bold text-slate-400 mb-6">基座五行雷达 [命局特征 B_i]</h2>
                <ResponsiveContainer width="100%" height="85%">
                  <RadarChart cx="50%" cy="50%" outerRadius="80%" data={radarData}>
                    <PolarGrid stroke="#334155" />
                    <PolarRadiusAxis angle={90} domain={[0, radarDomainMax]} tick={false} axisLine={false} />
                    <PolarAngleAxis dataKey="subject" tick={{ fill: '#94a3b8', fontSize: 14, fontWeight: 'bold' }} />
                    <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#1e293b' }} />
                    <Radar name="能量分布" dataKey="A" stroke="#06b6d4" fill="#06b6d4" fillOpacity={0.4} />
                  </RadarChart>
                </ResponsiveContainer>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [view, setView] = useState('input');
      const [baziModel, setBaziModel] = useState(null);

      const generateModel = (formData) => {
        if (typeof Solar === 'undefined' || !Solar) {
          alert('日历核心库加载失败，请检查网络连接或稍后刷新页面重试。');
          return;
        }

        const [year, month, day] = formData.date.split('-').map(Number);
        const [hour, minute] = formData.time.split(':').map(Number);
        
        const solar = Solar.fromYmdHms(year, month, day, hour, minute, 0);
        const lunar = solar.getLunar();
        const bazi = lunar.getEightChar();
        
        const pillars = {
          yStem: bazi.getYearGan(), yBranch: bazi.getYearZhi(),
          mStem: bazi.getMonthGan(), mBranch: bazi.getMonthZhi(),
          dStem: bazi.getDayGan(), dBranch: bazi.getDayZhi(),
          hStem: bazi.getTimeGan(), hBranch: bazi.getTimeZhi()
        };

        const yun = bazi.getYun(formData.gender === 'M' ? 1 : 0);
        const daYunsList = yun.getDaYun();
        
        const parsedDaYuns = daYunsList.map(dy => {
          return {
            ganZhi: dy.getGanZhi(),
            stem: dy.getGanZhi().charAt(0),
            branch: dy.getGanZhi().charAt(1),
            startYear: dy.getStartYear(),
            endYear: dy.getEndYear(),
            liuNians: dy.getLiuNian().map(ln => ({
              year: ln.getYear(),
              ganZhi: ln.getGanZhi(),
              stem: ln.getGanZhi().charAt(0),
              branch: ln.getGanZhi().charAt(1)
            }))
          };
        }).filter(dy => dy.ganZhi !== '' && dy.liuNians.length > 0);

        const currentYear = new Date().getFullYear();
        let defaultDyIdx = parsedDaYuns.findIndex(dy => currentYear >= dy.startYear && currentYear <= dy.endYear);
        if (defaultDyIdx === -1) defaultDyIdx = 0;

        let defaultLnIdx = parsedDaYuns[defaultDyIdx].liuNians.findIndex(ln => ln.year === currentYear);
        if (defaultLnIdx === -1) defaultLnIdx = 0;

        setBaziModel({
          gender: formData.gender,
          pillars,
          dmElement: STEMS[pillars.dStem],
          daYuns: parsedDaYuns,
          defaultDyIdx,
          defaultLnIdx
        });
        
        setView('result');
      };

      return view === 'input' 
        ? <InputView onGenerate={generateModel} /> 
        : <ResultDashboard baziModel={baziModel} onBack={() => setView('input')} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
